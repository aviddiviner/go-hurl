name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: check tag matches internal/version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "GoHurl = \"$version\"" internal/version/version.go || {
            echo "tag $GITHUB_REF_NAME doesn't match GoHurl in internal/version/version.go" >&2
            exit 1
          }
      - run: go vet ./...
      - run: go test ./...
      - run: scripts/package.sh "${GITHUB_REF_NAME#v}"
      - name: smoke test linux binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -xzf "build/dist/hurl-$version-x86_64-unknown-linux-gnu.tar.gz" -C build
          "build/hurl-$version-x86_64-unknown-linux-gnu/bin/hurl" --version | grep -q "(go-hurl $version)"
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/dist/* --title "$GITHUB_REF_NAME" --generate-notes
